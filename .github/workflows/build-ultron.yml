name: Build ULTRON for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "ULTRON/**"
      - ".github/workflows/build-ultron.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ULTRON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ULTRON ultron.py
      - name: Upload ULTRON.exe
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-Windows
          path: ULTRON/dist/ULTRON.exe
